app.base-url=http\://localhost:8080
app.max-ttl-seconds=157680000
app.shortcode.length=7
app.shortcode.strategy=random
app.shortcode.feistel-bits=40
app.shortcode.feistel-rounds=4
app.shortcode.feistel-key=2685821657736338717
app.shortcode.sequence-block=1000
app.ratelimit.capacity=100
app.ratelimit.refill-per-minute=100
app.ratelimit.trust-forwarded-for=false
app.ratelimit.max-clients=100000
app.ratelimit.client-idle-minutes=30
app.cache.enabled=true
app.cache.max-size=1000
spring.datasource.url=jdbc\:h2\:file\:./data/urlshortener
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=2000
spring.datasource.hikari.max-lifetime=1800000
spring.jpa.properties.jakarta.persistence.query.timeout=3000
spring.transaction.default-timeout=5
spring.h2.console.enabled=false
management.endpoints.web.exposure.include=health,info
logging.level.com.urlshortener=DEBUG
