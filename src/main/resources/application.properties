server.port=8080
app.base-url=http://localhost:8080
app.shortcode.length=7
app.ratelimit.capacity=100
app.ratelimit.refill-per-minute=100
app.cache.enabled=true
app.cache.max-size=1000
spring.datasource.url=jdbc:h2:file:./data/urlshortener
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
management.endpoints.web.exposure.include=health,info,metrics
logging.level.com.urlshortener=DEBUG
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
